name: Build and Release LVF-Tool

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows

          - os: ubuntu-latest
            platform: linux

    steps:
      # -------------------------
      # Checkout
      # -------------------------

      - name: Checkout
        uses: actions/checkout@v6

      # -------------------------
      # Python
      # -------------------------

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # -------------------------
      # Dependencies
      # -------------------------

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka

      # ============================================================
      # Windows
      # ============================================================

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python -m nuitka --standalone --onefile --enable-plugin=pyside6 --assume-yes-for-downloads --output-dir=build --output-filename=LVF-Tool.exe lvf_tool

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          Compress-Archive `
            -Path "build/LVF-Tool.exe" `
            -DestinationPath "release/LVF-Tool-${{ github.ref_name }}-windows.zip"

      # ============================================================
      # Linux
      # ============================================================

      - name: Build Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            --output-dir=build \
            --output-filename=LVF-Tool \
            lvf_tool

      - name: Package Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p release

          zip \
            "release/LVF-Tool-${{ github.ref_name }}-linux.zip" \
            build/LVF-Tool

      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: LVF-Tool-${{ github.ref_name }}-${{ matrix.platform }}
          path: release/*.zip

  # ==============================================================
  # GitHub Release
  # ==============================================================

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Download Windows artifact
      # -------------------------

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: LVF-Tool-${{ github.ref_name }}-windows
          path: release

      # -------------------------
      # Download Linux artifact
      # -------------------------

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: LVF-Tool-${{ github.ref_name }}-linux
          path: release

      # -------------------------
      # Create Release
      # -------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            release/*.zip \
            --title "LVF-Tool ${{ github.ref_name }}" \
            --generate-notes
