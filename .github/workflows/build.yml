name: Build and Release LVF-Tool

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows

          - os: ubuntu-latest
            platform: linux

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ============================================================
      # Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ============================================================
      # Dependencies
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka

      # ============================================================
      # Windows
      # ============================================================

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m nuitka --standalone --enable-plugin=pyside6 --assume-yes-for-downloads --output-dir=build --output-filename=LVF-Tool.exe lvf_tool

      - name: Debug Windows build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "WINDOWS BUILD CONTENTS"
          Write-Host "========================================"

          if (Test-Path "build") {
              Get-ChildItem -Recurse -Force "build"
          }
          else {
              Write-Error "The build directory does not exist."
          }

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          $dist = Get-ChildItem -Path "build" -Directory -Filter "*.dist" | Select-Object -First 1

          if (-not $dist) {
              Write-Error "Nuitka .dist directory was not found."
              exit 1
          }

          Write-Host "Using distribution directory: $($dist.FullName)"

          Compress-Archive `
            -Path "$($dist.FullName)/*" `
            -DestinationPath "release/LVF-Tool-${{ github.ref_name }}-windows.zip"

      # ============================================================
      # Linux
      # ============================================================

      - name: Build Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            --output-dir=build \
            --output-filename=LVF-Tool \
            lvf_tool

      - name: Debug Linux build
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          echo "========================================"
          echo "LINUX BUILD CONTENTS"
          echo "========================================"

          if [ -d "build" ]; then
            find build -maxdepth 3 -print
          else
            echo "The build directory does not exist."
            exit 1
          fi

      - name: Package Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p release

          DIST_DIR=$(find build -maxdepth 1 -type d -name "*.dist" -print -quit)

          if [ -z "$DIST_DIR" ]; then
            echo "Nuitka .dist directory was not found."
            exit 1
          fi

          echo "Using distribution directory: $DIST_DIR"

          cd build
          zip -r "../release/LVF-Tool-${{ github.ref_name }}-linux.zip" "$(basename "$DIST_DIR")"

      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: LVF-Tool-${{ github.ref_name }}-${{ matrix.platform }}
          path: release/*.zip

  # ==============================================================
  # GitHub Release
  # ==============================================================

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ============================================================
      # Download Windows artifact
      # ============================================================

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: LVF-Tool-${{ github.ref_name }}-windows
          path: release

      # ============================================================
      # Download Linux artifact
      # ============================================================

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: LVF-Tool-${{ github.ref_name }}-linux
          path: release

      # ============================================================
      # Create GitHub Release
      # ============================================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            release/*.zip \
            --title "LVF-Tool ${{ github.ref_name }}" \
            --generate-notes
